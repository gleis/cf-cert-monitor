name: Certificate monitor
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps .
      - name: Check certificates
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_SLACK_WEBHOOK_URL: ${{ secrets.CF_SLACK_WEBHOOK_URL }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "Configure the CF_API_TOKEN repository secret"; exit 1; }
          printf '{}' > config.json
          cf-cert-monitor --config config.json --fail-on-expiring --no-report
