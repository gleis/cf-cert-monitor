[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-cert-monitor"
version = "0.1.0"
description = "Monitor Cloudflare custom-hostname SSL certificates, alert on expiring certs, and publish an HTML report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cloudflare", "ssl", "certificates", "monitoring", "devops", "sre"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests>=2.31",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.5",
]

[project.scripts]
cf-cert-monitor = "cf_cert_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/gleis/cf-cert-monitor"
Issues = "https://github.com/gleis/cf-cert-monitor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cf_cert_monitor = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
